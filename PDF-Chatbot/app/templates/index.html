<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>PDF Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h2>PDF Chatbot</h2>

    <form method="post" enctype="multipart/form-data">
        <label>PDF yüklə</label>
        <input type="file" name="pdf" accept="application/pdf">

        <label>Sual yaz</label>
        <textarea name="question" placeholder="PDF haqqında sual yaz..."></textarea>

        <button type="submit">Göndər</button>
    </form>

    {% if answer %}
        <div class="answer">
            <h3>Cavab</h3>
            <p>{{ answer }}</p>
        </div>
    {% endif %}

    {% if chunks %}
        <div class="chunks">
            <h3>Tapılan hissələr</h3>

            {% for chunk in chunks %}
                <div class="chunk">
                    {{ chunk }}
                </div>
            {% endfor %}
        </div>
    {% endif %}
</div>

</body>
</html>
